---

### Soluciones rápidas según la causa más habitual:

#### 1. Si es en un navegador web (Chrome, Firefox, Edge, etc.)
* **Forzar recarga limpia:** Presiona `Ctrl` + `F5` (o `Shift` + `F5`). Esto ignora la caché cargada.
* **Probar en modo de incógnito:** Presiona `Ctrl` + `Shift` + `N` (o `P` en Firefox). Si carga bien ahí, el problema suele ser una extensión (como un bloqueador de publicidad) o la caché corrupta.
* **Desactivar la aceleración por hardware:** Ve a los ajustes del navegador, busca "aceleración por hardware" o "aceleración gráfica", desactívala y reinicia el navegador.

#### 2. Si es en un programa de escritorio (como Thunderbird u otras apps)
* **Conflicto de aceleración gráfica:** En Linux/Windows, la renderización por hardware a veces causa pantallas blancas. Iniciar la aplicación desde la terminal desactivando el renderizado o en modo seguro ayuda a diagnosticarlo:
  * Para Thunderbird / Firefox: `thunderbird --safe-mode` o `firefox --safe-mode`
* **Procesos colgados:** Cierra completamente la aplicación desde el gestor de tareas / monitor del sistema y vuelve a abrirla.

#### 3. Si es en una aplicación o servicio Web / API
* Puede ser un error de script (**JavaScript**) o de red. Si presionas `F12` para abrir las herramientas de desarrollo y vas a la pestaña **Console** (Consola) o **Network** (Red), verás si hay un error en rojo especificando la falla.

#### 4. Si es en la pantalla/display de un equipo de hardware o embebido
* **Retroiluminación / Contraste:** Si la pantalla enciende pero no muestra caracteres, suele ser pérdida de comunicación de datos (líneas SDA/SCL en I2C o buses de datos desconectados) mientras el backlight sigue recibiendo energía, o un desajuste en el potenciómetro de contraste.
