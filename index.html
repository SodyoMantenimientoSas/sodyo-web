### 1. Solución Técnica Imprevista (Instalar Certificado SSL)

El objetivo es que en la barra de direcciones aparezca el candado de conexión segura (`https://sodyomantenimientosas.com`)[cite: 1].

1. **Instalar un Certificado SSL gratuito (Let’s Encrypt):**
   * Si gestionas el servidor con un panel como cPanel, Plesk o DirectAdmin, ve a la sección **SSL/TLS** o **Let’s Encrypt** y activa un certificado SSL gratuito para el dominio y subdominios (`sodyomantenimientosas.com` y `www.sodyomantenimientosas.com`)[cite: 1].
   * Si usas Nginx o Apache en Linux, puedes instalar **Certbot** y ejecutar:
     ```bash
     sudo certbot --nginx -d sodyomantenimientosas.com -d [www.sodyomantenimientosas.com](https://www.sodyomantenimientosas.com)
     ```
2. **Forzar la redirección de HTTP a HTTPS:**
   * Una vez instalado el certificado, asegúrate de que cualquier usuario que entre a `http://` sea redirigido automáticamente a `https://`.
   * En Nginx agregas un bloque de servidor escuchando en el puerto 80 que devuelva `301 https://$host$request_uri;`.
   * En Apache / `.htaccess`:
     ```htaccess
     RewriteEngine On
     RewriteCond %{HTTPS} off
     RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
     ```

### 2. Ajustes Visuales y de Texto en la Web

Aparte de la alerta del navegador, hay un par de detalles en la página que rompen la estética o restan profesionalismo ante un cliente corporativo:

1. **Eliminar los corchetes con citas tipo `[cite: 1]`:**
   * En el texto de las tarjetas de servicios y bajo la sección de contacto aparecen etiquetas residuales tipo `[cite: 1]`[cite: 1]. Esto ocurre cuando se copia directamente el texto generado por una IA o un borrador[cite: 1].
   * **Acción:** Revisa el código HTML/React del sitio y borra manualmente todas esas marcas `[cite: 1]` de las descripciones[cite: 1].

2. **Verificar el formulario de contacto con HTTPS:**
   * Al tener un formulario ("Habla con un Especialista" / "Nombre completo"), los navegadores como Chrome y Firefox castigan doblemente la falta de SSL etiquetando el sitio como no seguro en cuanto el usuario hace clic en un campo de texto[cite: 1]. Al activar HTTPS, los datos introducidos por el cliente viajarán de forma cifrada.
